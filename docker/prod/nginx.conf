gzip              on;
gzip_comp_level   5;
gzip_min_length   512;
gzip_proxied      any;
gzip_types
    text/plain text/css text/javascript text/xml
    application/json application/javascript application/xml application/xml+rss
    application/rss+xml image/svg+xml font/woff font/woff2;

# Brotli (requires nginx-mod-http-brotli — installed in Dockerfile).
# Higher compression ratio than gzip for the same CPU; modern browsers prefer it.
brotli              on;
brotli_comp_level   5;
brotli_min_length   512;
brotli_types
    text/plain text/css text/javascript text/xml
    application/json application/javascript application/xml application/xml+rss
    application/rss+xml image/svg+xml font/woff font/woff2;

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 25M;
    server_tokens off;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content Signals (IETF draft-romm-aipref-contentsignals) — declare AI
    # usage preferences. search-engine indexing welcome; real-time answer
    # use welcome (citation expected); do not use for generative training.
    add_header Content-Signal "ai-train=no, search=yes, ai-input=yes"        always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # robots.txt: short cache so Content-Signal policy changes propagate
    # through Cloudflare/intermediaries within minutes rather than days.
    location = /robots.txt {
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, max-age=300, s-maxage=300, must-revalidate" always;
    }

    error_page 404 /index.php;

    # Long-lived caching for fingerprinted Vite build output.
    # `add_header` is the single source of truth — `expires` would emit a
    # second Cache-Control header that some intermediaries concatenate.
    location ^~ /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Static assets that may or may not be fingerprinted
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
