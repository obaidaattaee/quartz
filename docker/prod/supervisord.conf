[supervisord]
nodaemon = true
user     = root
pidfile  = /tmp/supervisord.pid
logfile  = /dev/null
logfile_maxbytes = 0

[program:php-fpm]
command          = /usr/local/sbin/php-fpm --nodaemonize
autostart        = true
autorestart      = true
priority         = 10
stdout_logfile   = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile   = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command          = /usr/sbin/nginx -g "daemon off;"
autostart        = true
autorestart      = true
priority         = 20
stdout_logfile   = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile   = /dev/stderr
stderr_logfile_maxbytes = 0

# --max-time makes the worker exit cleanly every hour to shed leaked memory;
# autorestart brings it straight back. stopwaitsecs gives an in-flight job time
# to finish on SIGTERM instead of being killed mid-write.
[program:queue]
command          = php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory        = /var/www/html
user             = www-data
autostart        = true
autorestart      = true
priority         = 30
startsecs        = 5
stopsignal       = TERM
stopwaitsecs     = 60
stdout_logfile   = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile   = /dev/stderr
stderr_logfile_maxbytes = 0

# schedule:work is Laravel's own foreground minute loop — replaces the old
# `while true; schedule:run; sleep 60; done` shell wrapper.
[program:scheduler]
command          = php /var/www/html/artisan schedule:work --no-interaction
directory        = /var/www/html
user             = www-data
autostart        = true
autorestart      = true
priority         = 40
startsecs        = 5
stopsignal       = TERM
stopwaitsecs     = 60
stdout_logfile   = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile   = /dev/stderr
stderr_logfile_maxbytes = 0
